# =============================================================================
# ShopBrasil - Pipeline de preços por categoria (Apache Airflow)
#
# Serviços:
#   - postgres           -> banco de METADADOS do Airflow (uso interno do Airflow)
#   - postgres-dw        -> base ANALÍTICA na qual as tasks gravam as métricas
#   - airflow-init       -> execução única: os comandos migram o banco e criam o usuário admin e o pool
#   - airflow-webserver  -> interface web (http://localhost:8080)
#   - airflow-scheduler  -> processos que agendam e executam as tasks (LocalExecutor)
#
# Adotam-se os LocalExecutors para manter o projeto leve (sem Redis/Celery).
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Definem-se os fusos horários padrão da instalação (as DAGs também fixam os seus via pendulum).
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Sao_Paulo
    # Habilitam-se as verificações de SLA (Airflow 2.x).
    AIRFLOW__CORE__CHECK_SLAS: "true"
    # Configuram-se as Connections do Airflow apontando para a base analítica.
    # As variáveis de ambiente as definem, dispensando-se cadastros na UI.
    # Conn ID resultante: "postgres_dw"
    AIRFLOW_CONN_POSTGRES_DW: postgresql://dw_user:dw_pass@postgres-dw:5432/shopbrasil_dw
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    postgres-dw:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  postgres-dw:
    image: postgres:16
    environment:
      POSTGRES_USER: dw_user
      POSTGRES_PASSWORD: dw_pass
      POSTGRES_DB: shopbrasil_dw
    volumes:
      - postgres-dw-data:/var/lib/postgresql/data
      # Os scripts desta pasta executam somente nas primeiras inicializações do container (volumes vazios).
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"   # expõem-se as conexões na porta 5433 do host, evitando-se conflitos com instâncias locais do PostgreSQL
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dw_user", "-d", "shopbrasil_dw"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo ">> Migrando banco de metadados..."
        airflow db migrate
        echo ">> Criando usuário admin..."
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin --lastname ShopBrasil \
          --role Admin --email admin@shopbrasil.local || true
        echo ">> Criando pool ecommerce_pool (2 slots)..."
        airflow pools set ecommerce_pool 2 "Limita a concorrência do cálculo de métricas por categoria"
        # Os comandos de init executam como root; por isso, devolvem-se as permissões da pasta
        # de logs aos usuários do Airflow (caso contrário, os schedulers não conseguem escrever
        # e as DAGs nunca são registradas).
        mkdir -p /opt/airflow/logs
        chown -R "$${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        echo ">> Init concluído."
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    user: "0:0"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-airflow-data:
  postgres-dw-data:
